DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: runs/exp
MODEL:
  NAME: RhythmFormerMT
  RHYTHMFORMERMT:
    IN_CHANNELS: 4            # R, G, B, T
    FUSION_TYPE: activity_gate
    GATE_BLEND_MODE: learned
    GATE_ACTIVITY_WINDOW: 80   # Ablation: 50% of 160-frame clip, centered window
    TASKS: ['hr', 'br', 'eda']
    DROP_RATE: 0.2
    EDA_LOG_MEAN: 5.15
    EDA_LOG_STD: 1.56
INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: "FFT"
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: False
    WINDOW_SIZE: 5
  MODEL_PATH: ""
