      DATA_TYPE: ['Standardized']
      LABEL_TYPE: MultiTask
      DO_CHUNK: True
      CHUNK_LENGTH: 256
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
