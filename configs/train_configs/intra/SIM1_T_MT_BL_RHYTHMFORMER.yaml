BASE: ['']
TOOLBOX_MODE: "train_and_test"
TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 50
  LR: 9e-3
  MODEL_FILE_NAME: SIM1_T_MT_BL_RhythmFormer
  AUG: 0
  DATA:
    FS: 8.5
    DATASET: SIM1
    DO_PREPROCESS: True
    DATA_FORMAT: NDCHW
    DATA_PATH: "/mnt/nvme/hiqbal/dataset/SIM1"
