BASE: ['']
TOOLBOX_MODE: "train_and_test"  # "train_and_test" or "only_train" or "only_test"
TRAIN:
  BATCH_SIZE: 4
  AUG: 1
  EPOCHS: 100
  LR: 9e-3
  MODEL_FILE_NAME: iBVP_iBVP_iBVP_RhythmFormer_Thermal_Fusion
  #PLOT_LOSSES_AND_LR: True
  DATA:
    FS: 30
    DATASET: iBVP_RGBThermal
    DO_PREPROCESS: True                  # if first time, should be true
    DATA_FORMAT: NCDHW
    DATA_PATH: "/mnt/nvme/hiqbal/dataset/iBVP/"   # Raw dataset path, need to be updated
    CACHED_PATH: "../dataset/iBVP/iBVP_Thermal_cache" # Processed dataset save path, need to be updated
    EXP_DATA_NAME: "iBVP_RGBT_240_128x128"
    BEGIN: 0.0
    END: 0.7
    PREPROCESS:
      DATA_TYPE: ['Standardized']         #if use FactorizePhys, should be Raw
      DATA_AUG: ['None']    # 'None' or 'Motion' is supported, used if the data path points to an augmented dataset or requires augmentation
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'    # HC for Haar Cascade, Y5F for YOLO5Face, Y5F_IR for running it on thermal frames
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY : 30
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      IBVP:
        DATA_MODE: RGBT
      RESIZE:
        H: 128
        W: 128
VALID:
  DATA:
    FS: 30
    DATASET: iBVP_RGBThermal
    DO_PREPROCESS: True                  # if first time, should be true
    DATA_FORMAT: NCDHW
    DATA_PATH: "/mnt/nvme/hiqbal/dataset/iBVP/"   # Raw dataset path, need to be updated
    CACHED_PATH: "../dataset/iBVP/iBVP_Thermal_cache" # Processed dataset save path, need to be updated
    EXP_DATA_NAME: "iBVP_RGBT_240_128x128"
    BEGIN: 0.7
    END: 1.0
    PREPROCESS:
      DATA_TYPE: ['Standardized']         #if use FactorizePhys, should be Raw
      DATA_AUG: ['None']    # 'None' or 'Motion' is supported, used if the data path points to an augmented dataset or requires augmentation
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'    # HC for Haar Cascade, Y5F for YOLO5Face, Y5F_IR for running it on thermal frames
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY : 30
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      IBVP:
        DATA_MODE: RGBT
      RESIZE:
        H: 128
        W: 128
TEST:
  METRICS: ['MAE','RMSE','MAPE','Pearson','SNR'] #['MAE', 'RMSE', 'MAPE', 'MACC', 'Pearson', 'SNR', 'BA']
  USE_LAST_EPOCH: False                  # use validation dataset to find the best epoch
  DATA:
    FS: 30
    DATASET: iBVP_RGBThermal
    DO_PREPROCESS: True                  # if first time, should be true
    DATA_FORMAT: NCDHW
    DATA_PATH: "/mnt/nvme/hiqbal/dataset/iBVP/"   # Raw dataset path, need to be updated
    CACHED_PATH: "../dataset/iBVP/iBVP_Thermal_cache" # Processed dataset save path, need to be updated
    EXP_DATA_NAME: "iBVP_RGBT_240_128x128"
    BEGIN: 0.7
    END: 1.0
    PREPROCESS:
      DATA_TYPE: ['Standardized']         #if use FactorizePhys, should be Raw
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'    # HC for Haar Cascade, Y5F for YOLO5Face, Y5F_IR for running it on thermal frames
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY : 30
          USE_MEDIAN_FACE_BOX: False    # This should be used ONLY if dynamic detection is used
      IBVP:
        DATA_MODE: RGBT
      RESIZE:
        H: 128
        W: 128
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: runs/exp
MODEL:
  DROP_RATE: 0.2
  NAME: RhythmFormer
INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: "FFT"        # "FFT" or "peak detection"
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: False        # Change this if you'd like an evaluation window smaller than the test video length
    WINDOW_SIZE: 5        # In seconds
  MODEL_PATH: ""