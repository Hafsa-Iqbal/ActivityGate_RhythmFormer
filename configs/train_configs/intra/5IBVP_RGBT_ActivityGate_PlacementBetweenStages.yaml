BASE: ['']
TOOLBOX_MODE: "train_and_test"
TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 50
  LR: 9e-3
  MODEL_FILE_NAME: iBVP_RGBT_ActivityGate_PlacementBetweenStages
  AUG: 1
  DATA:
    FS: 30.0
    DATASET: iBVP
    DO_PREPROCESS: False
    DATA_FORMAT: NDCHW
    DATA_PATH: "/mnt/nvme/hiqbal/dataset/iBVP/seqA/"
    CACHED_PATH: "../dataset/iBVP/iBVP_RGBT_cache_seqA"
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 0.72
    PREPROCESS:
      DATA_TYPE: [ 'Standardized' ]
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      IBVP:
        DATA_MODE: RGBT
      RESIZE:
        H: 128
        W: 128
VALID:
  DATA:
    FS: 30.0
    DATASET: iBVP
    DO_PREPROCESS: False
    DATA_FORMAT: NDCHW
    DATA_PATH: "/mnt/nvme/hiqbal/dataset/iBVP/seqA/"
    CACHED_PATH: "../dataset/iBVP/iBVP_RGBT_cache_seqA"
    EXP_DATA_NAME: ""
    BEGIN: 0.72
    END: 0.86
    PREPROCESS:
      DATA_TYPE: [ 'Standardized' ]
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      IBVP:
        DATA_MODE: RGBT
      RESIZE:
        H: 128
        W: 128
TEST:
  METRICS: ['MAE','RMSE','MAPE','Pearson','SNR']
  USE_LAST_EPOCH: False
  DATA:
    FS: 30.0
    DATASET: iBVP
    DO_PREPROCESS: False
    DATA_FORMAT: NDCHW
    DATA_PATH: "/mnt/nvme/hiqbal/dataset/iBVP/seqA/"
    CACHED_PATH: "../dataset/iBVP/iBVP_RGBT_cache_seqA"
    EXP_DATA_NAME: ""
    BEGIN: 0.86
    END: 1.0
    PREPROCESS:
      DATA_TYPE: [ 'Standardized' ]
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      IBVP:
        DATA_MODE: RGBT
      RESIZE:
        H: 128
        W: 128
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: runs/exp
MODEL:
  DROP_RATE: 0.2
  NAME: RhythmFormer
  RHYTHMFORMER:
    IN_CHANNELS: 4
    FUSION_TYPE: activity_gate
    GATE_BLEND_MODE: learned
    GATE_PLACEMENT: between_stages   # Ablation: gate reapplied at each TPT stage boundary
INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: "FFT"
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: False
    WINDOW_SIZE: 5
  MODEL_PATH: ""
